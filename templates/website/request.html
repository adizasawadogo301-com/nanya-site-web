{% extends "website/base.html" %}{% block title %}Demande de service — NANYA{% endblock %}{% block content %}<section class="page"><div class="wrap"><small>VOTRE PROJET</small><h1>Demande de service</h1></div></section><section class="section"><div class="wrap narrow"><form class="form" method="post">{% csrf_token %}<label>Nom et prénom<input name="name" required></label><label>Organisation<input name="organization"></label><label>E-mail<input type="email" name="email" required></label><label>Téléphone<input name="phone" required></label><label>Service / domaine<select name="service" required><option value="">Choisir</option>{% for d in domains %}<option>{{d.1}}</option>{% endfor %}</select></label><label>Précisions<textarea name="message" rows="7"></textarea></label><button class="btn">Envoyer la demande</button></form></div></section>{% endblock %}
